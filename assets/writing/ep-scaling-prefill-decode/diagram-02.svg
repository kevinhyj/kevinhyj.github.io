<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="Copies per token versus EP, with and without per-card deduplication" class="ev" role="img" style="background:#fff;width:100%;height:auto;display:block" viewBox="0 0 720 450" xmlns="http://www.w3.org/2000/svg"><style>:root{--text:#171717;--secondary:#767676;--background:#fff;--quiet-line:#e6e6e1;--technical:#4d74a8;--reflection:#d95f49;--text-faint:#8a8a8a;--panel:#f7f7f4;--surface:#f7f7f4}</style><style>
.ev text{font-family:'Spectral',Georgia,'Songti SC',STSong,serif}
.ev .t{fill:var(--text);font-size:13px}
.ev .s{fill:var(--secondary);font-size:12px}
