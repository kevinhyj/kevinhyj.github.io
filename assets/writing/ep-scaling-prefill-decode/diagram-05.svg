<?xml version="1.0" encoding="UTF-8"?>
<svg aria-label="DeepInfer official decode throughput versus per-user speed, EP64 and EP8" class="ev" role="img" style="background:#fff;width:100%;height:auto;display:block" viewBox="0 0 720 430" xmlns="http://www.w3.org/2000/svg"><style>:root{--text:#171717;--secondary:#767676;--background:#fff;--quiet-line:#e6e6e1;--technical:#4d74a8;--reflection:#d95f49;--text-faint:#8a8a8a;--panel:#f7f7f4;--surface:#f7f7f4}</style><style>
.ev text{font-family:'Spectral',Georgia,'Songti SC',STSong,serif}
.ev .t{fill:var(--text);font-size:13px}
.ev .s{fill:var(--secondary);font-size:12px}
.ev .si{fill:var(--secondary);font-size:12.5px;font-style:italic}
.ev .h{fill:var(--text);font-size:13.5px;font-weight:500}
.ev .grid{stroke:var(--quiet-line);stroke-width:1}
