xt><rect class="f-ink" height="20" opacity="0.55" rx="4" width="310.1" x="303.99999999999983" y="250.0"><title>H100, FP8 weights: r* ≈ 295 rows</title></rect><text class="t" text-anchor="start" x="622.1" y="265.0">295</text><text class="t" text-anchor="end" x="292.0" y="310.0">B200, FP4 weights × FP4 activations</text><rect class="f-ink" height="20" opacity="0.55" rx="4" width="313.8" x="303.99999999999983" y="296.0"><title>B200, FP4 weights × FP4 activations: r* ≈ 299 rows</title></rect><text class="t" text-anchor="start" x="625.8" y="311.0">299</text><text class="s" text-anchor="start" x="40.0" y="376.0">Blue: the configuration in this post. Dense peak and memory bandwidth from public specs.</text></svg>